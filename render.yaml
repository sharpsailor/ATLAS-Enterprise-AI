# Render Blueprint: Dashboard > New > Blueprint > pick this repo. Secrets (sync: false) are asked for at creation.
services:
  - type: web
    name: atlas
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL          # Neon connection string (includes sslmode=require)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_HOST   # a separate 1024-dim cosine index, not the local Ollama one
        sync: false
      - key: AWS_ENDPOINT_URL      # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
        sync: false
      - key: AWS_ACCESS_KEY_ID     # R2 API token access key
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: MIN_RELEVANCE         # tuned on Gemini scores: unrelated ~0.58-0.62, matches ~0.69+
        value: "0.64"
      - key: S3_BUCKET
        value: atlas-docs
      - key: MAX_CHUNKS            # per document (~160 pages), protects the free Gemini quota
        value: "400"
      - key: CHAT_LIMIT_PER_HOUR   # per visitor IP, protects the free Gemini quota
        value: "20"
      - key: APP_PASSWORD          # admin password for uploads and approval decisions
        sync: false
      - key: RIUS_API_KEY
        sync: false
